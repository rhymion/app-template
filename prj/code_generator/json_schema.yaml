  # Line entities (purchase_order_line, asn_line, goods_receipt_line) carry their
  # own x-generate because other entities reference them by FK, and
  # schema-yaml-configuration.md §15.9 forbids a FK targeting an embedded child.
  # Consequence (§7.3 Rule 1): a header's line list renders read-only on the
  # header page; lines are created and edited on their own pages. Each of them
  # declares a composite dotted x-import-key so they are CSV-importable.
