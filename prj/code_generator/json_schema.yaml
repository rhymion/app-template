  # The receiving line drives the inventory ledger.
  #
  #  * x-approval        — each line is approved on its own; approval is the
  #                        moment stock actually lands. Rejection is terminal:
  #                        re-assigning quantity to another lot goes through
  #                        split, not through a resubmit loop.
  #  * x-ledger-source   — on approval, emit_hook generates
  #                        lib/goods_receipt_line/service_after_approve.ts,
  #                        which writes the `receive` ledger row and increments
  #                        the pool row named by poolIdField.
  #  * x-splittable      — one received line can be divided across lots/bins;
  #                        each part gets its own approvable and its own ledger
  #                        bridge, so each part is approved (and posted) alone.
  goods_receipt_line:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: false
    x-import-key: [goods_receipt.receipt_number, item.sku]
    x-approval:
      on_approved:
        emit_hook: true
        # Mapping of field -> value (generate.py's _resolve_set_fields iterates
        # .items()). The list-of-{field,value} form in appendix/approval-flow.md
        # §16.9 is stale and raises AttributeError.
        set_fields:
          status: accepted
      on_rejected:
        terminal: true
        set_fields:
          status: rejected
    x-ledger-source:
      ledgerDomain: inventory_domain
      event_type: receive
      quantity_delta_field: quantity_received
      poolIdField: inventory_id
    x-splittable:
      quantityField: quantity_received
      parentField: parent_goods_receipt_line_id
      perPartRequired:
        - inventory_id
      ledgerDomain: inventory_domain
      poolIdField: inventory_id
      bridgeField: inventory_transactionable_id
    x-custom-components:
      - name: ApprovalSection
        path: "@/components/_standard/ApprovalSection"
        target:
          - view
          - edit
    x-display:
      table:
        - item:
            primary: true
            width: 180
        - goods_receipt:
            width: 170
        - quantity_received:
            width: 160
        - status:
            width: 170
        - inventory:
            width: 200
    fields:
      quantity_received: {}
      lot_number: {}
      expiry_date:
        format: date
      # `pending`, `split` and `rejected` are required members — the generated
      # split route creates every split child with status 'pending' and
      # compares against SPLIT_STATUS / REJECTED_STATUS.
      status:
        enum:
          - pending
          - received
          - inspecting
          - accepted
          - rejected
          - put_away
          - split
        default: pending
      discrepancy_reason: {}
      goods_receipt_id:
        x-relationship:
          labelField: receipt_number
      # Plain single-field labelFields (see the note on asn_line): every FK
      # display column on an importable entity must be resolvable back to a row.
      purchase_order_line_id:
        x-relationship:
          labelField: id
      asn_line_id:
        x-relationship:
          labelField: id
      item_id:
        x-relationship:
          labelField: sku
      destination_bin_id:
        x-relationship:
          labelField: code
      inventory_id:
        x-relationship:
          labelField: id
      # Server-managed plumbing, hidden from forms and list columns:
