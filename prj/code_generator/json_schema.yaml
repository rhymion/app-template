  # ---- Ledger domain: pool / ledger / transactionable ------------------------
  # Declared together as the `inventory_domain` aggregate in x-ledger-entities
  # at the top of this file.

  # Pool — materialized stock-on-hand per (product, location, lot, expiry).
  # Column names are fixed by ledger_write_stub.ts.jinja2; `product_id` points
  # at `item` through a relation field named `product`.
  inventory:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: false
    # No `primary: true`: the only required non-FK scalar candidates all carry
    # Prisma defaults, and an FK primary whose relation name differs from its
    # target entity name (product -> item) makes generators_test.py's
    # primary_fk_dep_target lookup miss, so the generated spec references a
    # `deps.product2` the helper never creates.
    x-display:
      table:
        - product:
            width: 180
        - location:
            width: 170
        - lot_number:
            width: 150
        - quantity:
            width: 130
        - reserved_quantity:
            width: 150
      dashboard: true
    fields:
      lot_number: {}
      expiration_date:
        format: date
      quantity:
        default: 0
      reserved_quantity:
        default: 0
      product_id:
        x-relationship:
          labelField: sku
    properties:
      product:
        $ref: "#/definitions/item"
      location:
        $ref: "#/definitions/location"

  # Transactionable — internal bridge; no pages, no API. Mirrors the shape of
  # the framework's own approvable/commentable/attachable stubs.
  inventory_transactionable:
    x-generate:
      list: false
      view: false
      new: false
      edit: false
      delete: false
      invalidate: false
      api: false
      test: false
      search: false

  # Ledger — append-oriented movement rows. `quantity_delta` moves physical
  # stock, `reserved_delta` the reservation counter; product/location/lot/expiry
  # are the denormalized pool identity (O-6) captured at write time.
  inventory_transaction:
    x-generate:
      list: true
      view: true
      new: true
      edit: true
      delete: true
      invalidate: false
      api: true
      test: true
      search: false
    # Primary is the required non-FK `event_type`, not `product`: see the note
    # on `inventory` for why an aliased FK primary breaks the generated spec.
    x-display:
      table:
        - event_type:
            primary: true
            width: 160
        - product:
            width: 180
        - quantity_delta:
            width: 140
        - reserved_delta:
            width: 140
        - occurred_at:
            width: 190
      dashboard: true
    fields:
      event_type:
        enum:
          - receive
          - ship
          - reserve
          - release
          - adjust
          - move
          - write_off
          - return_to_supplier
        default: receive
        # cmd_574: adding @default(receive) in Prisma (to satisfy the new
        # cross-schema default check) makes schema_deriver's Category A
        # "required" derivation treat this as optional (has_default=True) --
        # but it's still the list view's primary display column, which must
        # stay required. Same escape hatch app-generator's own
        # attachment.type uses for the identical situation.
        _required: true
      quantity_delta:
        default: 0
      reserved_delta:
        default: 0
      # cmd_562: id-FK (was a denormalized display-string snapshot with a
      # Prisma default; nullable now, so the old FormViewProps type-mismatch
      # note no longer applies). See
      # docs/knowledge/appendix/cmd562-location-id-fk-consumer-migration.md.
      location_id:
        x-relationship:
          labelField: name
      lot_number: {}
      expiration_date:
        format: date
      approved_via: {}
      reason: {}
      serial_number: {}
      source_document_type: {}
      source_document_ref: {}
      occurred_at: {}
      product_id:
        x-relationship:
          labelField: sku
      bin_id:
        x-relationship:
          labelField: code
      created_by_id:
        x-relationship:
          target: user
          labelField: name
      inventory_transactionable_id: {}
    properties:
      product:
        $ref: "#/definitions/item"
      bin:
        $ref: "#/definitions/bin"
      created_by:
        $ref: "#/definitions/user"
      location:
        $ref: "#/definitions/location"
